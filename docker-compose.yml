services:
  mediamtx:
    image: bluenviron/mediamtx:1.18.2
    container_name: livestream-mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"
      - "8237:8237"
      - "8189:8189/udp"
    expose:
      - "9997"

  api:
    build: .
    container_name: livestream-api
    environment:
      MEDIAMTX_API_BASE: http://mediamtx:9997
      PUBLIC_WEBRTC_BASE: http://localhost:8237
      API_HOST: 0.0.0.0
      API_PORT: 8236
    ports:
      - "8236:8236"
    depends_on:
      - mediamtx
